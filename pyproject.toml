[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-radar"
version = "0.1.0"
description = "Radar de leilões de veículos em São Paulo"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
auction-radar = "auction_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["auction_radar*"]
